name: CI and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  windows:
    name: Validate or release Windows build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Lint
        run: npm run lint

      - name: Frontend regression tests
        run: npm test

      - name: Frontend production build
        run: npm run build:frontend

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles nsis

      - name: Create release and upload installer
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Kubebs ${{ github.ref_name }}
          body: Download the Kubebs Windows installer below.
          draft: false
          prerelease: false
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          fail_on_unmatched_files: true
