[package]
name = "infra"
version = "0.2.0"
description = "A focused Kubernetes desktop client"
authors = ["Infra"]
edition = "2021"

[lib]
name = "infra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
kube = { version = "4.2", features = ["client", "config", "runtime", "rustls-tls", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "io-util", "macros", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
